<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Board BMC</title>
<style>
  :root{
    --bg:#090b10;
    --panel:rgba(19,22,29,.78);
    --panel-solid:#13161d;
    --panel-hi:rgba(255,255,255,.035);
    --line:rgba(255,255,255,.06);
    --line-strong:rgba(255,255,255,.11);
    --txt:#eef1f8;
    --muted:#7f8899;
    --muted2:#545c6b;
    --accent:#6d7dff;
    --accent2:#a78bfa;
    --accent-rgb:109,125,255;
    --danger:#ff6b6b;
    --board-bg:#ffffff;
    --grid-color:rgba(15,20,40,.10);
    --zoom:1;
    --r-lg:16px; --r-md:12px; --r-sm:9px;
    --shadow-1: 0 1px 2px rgba(0,0,0,.3);
    --shadow-2: 0 8px 24px rgba(0,0,0,.35);
    --shadow-3: 0 24px 60px rgba(0,0,0,.55);
    --shadow-accent: 0 8px 24px rgba(var(--accent-rgb), .38);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color:var(--txt);
    background-color:var(--bg);
    background-image:
      radial-gradient(1200px 800px at 15% -10%, rgba(var(--accent-rgb),.11), transparent 60%),
      radial-gradient(900px 700px at 100% 0%, rgba(167,139,250,.07), transparent 60%),
      radial-gradient(1000px 900px at 50% 120%, rgba(var(--accent-rgb),.05), transparent 60%);
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-size:14px;
    transition: background-color .4s;
  }

  /* ============ TOP BAR ============ */
  .topbar{
    height:62px; flex:none; display:flex; align-items:center; gap:6px;
    padding:0 18px;
    background: linear-gradient(180deg, rgba(22,25,33,.9) 0%, rgba(12,14,19,.92) 100%);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom:1px solid var(--line);
    z-index:40; position:relative;
  }
  .topbar::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(var(--accent-rgb),.55) 30%,
      rgba(167,139,250,.45) 70%,
      transparent 100%);
    pointer-events:none;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:14.5px; letter-spacing:.3px;
    margin-right:12px; white-space:nowrap;
  }
  .brand .logo{
    width:26px; height:26px; flex:none;
    border-radius:9px;
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(var(--accent-rgb),.55),
                inset 0 1px 0 rgba(255,255,255,.35);
    font-size:14px; color:#fff; font-weight:900;
    transform: rotate(-3deg);
    transition: transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  .brand:hover .logo{ transform: rotate(3deg) scale(1.05); }
  .brand .txt{
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sep{width:1px; height:26px; background:var(--line-strong); margin:0 8px; flex:none;}
  .spacer{flex:1;}

  .tool,.btn{
    height:40px; min-width:40px; padding:0 11px;
    border-radius:11px; border:1px solid transparent;
    background:transparent; color:var(--muted);
    font-size:15px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    transition: background .18s, color .18s, transform .18s, box-shadow .22s, border-color .18s;
    font-family:inherit; font-weight:600;
    flex:0 0 auto;
    position:relative;
    overflow:hidden;
  }
  .tool::before{
    content:''; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 120%, rgba(var(--accent-rgb),.25), transparent 70%);
    opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  .tool:hover,.btn:hover{
    background: var(--panel-hi); color:var(--txt);
    border-color: var(--line);
  }
  .tool:hover::before{ opacity:1; }
  .tool:active{ transform: scale(.96); }
  .tool.active{
    background: linear-gradient(140deg, var(--accent) 0%, var(--accent2) 100%);
    color:#fff;
    border-color: transparent;
    box-shadow: var(--shadow-accent), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .tool.active::before{ opacity:0; }
  .tool svg,.btn svg{ display:block; position:relative; z-index:1; }

  .btn.ghost{ border-color:var(--line); }
  .btn.ghost:hover{ border-color:var(--line-strong); background: var(--panel-hi); }
  .btn.danger:hover{
    background: rgba(255,107,107,.12);
    color:#ff9a9a;
    border-color: rgba(255,107,107,.28);
  }

  /* --- accent button --- */
  .btn-accent{
    width:40px; height:40px; padding:0;
    border-radius:11px;
    border:1px solid var(--line);
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.16), transparent 55%),
      linear-gradient(140deg, var(--accent) 0%, var(--accent2) 100%);
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(var(--accent-rgb),.35),
                inset 0 1px 0 rgba(255,255,255,.3);
    transition: transform .18s cubic-bezier(.3,1.3,.4,1), box-shadow .22s;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .btn-accent:hover{
    transform: scale(1.06) rotate(-3deg);
    box-shadow: 0 10px 26px rgba(var(--accent-rgb),.5),
                inset 0 1px 0 rgba(255,255,255,.4);
  }
  .btn-accent:active{ transform: scale(.96); }
  .btn-accent svg{ display:block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }

  /* --- language select --- */
  .lang-sel{
    height:36px;
    width:auto; flex:0 0 auto;
    min-width:64px; max-width:76px;
    background-color: var(--panel-hi);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path fill='%237f8899' d='M0 0l4 5 4-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 9px center;
    color: var(--muted);
    border:1px solid var(--line);
    border-radius:10px;
    padding:0 22px 0 11px;
    font-family:inherit; font-size:12px; font-weight:700;
    cursor:pointer; outline:none;
    transition: all .15s; letter-spacing:.5px;
    -webkit-appearance:none; appearance:none;
    text-align:left;
  }
  .lang-sel:hover{ color:var(--txt); border-color:var(--line-strong); }
  .lang-sel option{ background:#1a1d26; color:var(--txt); }

  /* ============ BOARD ============ */
  #board{
    position:relative; flex:1; overflow:hidden;
    background-color: var(--board-bg);
    background-image: radial-gradient(circle, var(--grid-color) 1.2px, transparent 1.2px);
    background-size: 24px 24px;
    background-position: 0 0;
    touch-action:none;
    transition: background-color .35s;
  }
  #board[data-grid="lines"]{
    background-image:
      linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
  }
  #board[data-grid="none"]{ background-image:none; }
  #board[data-theme="dark"]{
    --board-bg:#0f1218;
    --grid-color:rgba(255,255,255,.05);
  }

  #world{
    position:absolute; left:0; top:0; width:0; height:0;
    overflow:visible; will-change:transform;
    transform-origin:0 0;
  }
  #preview{
    position:absolute; inset:0; pointer-events:none;
    z-index:5; overflow:visible;
  }
  #board.board-drawing .obj{ pointer-events:none !important; }

  /* ============ OBJECTS ============ */
  .obj{
    position:absolute; transform-origin:center center;
    pointer-events:auto; touch-action:none;
  }
  .obj img{
    width:100%; height:100%; display:block; pointer-events:none;
    user-select:none; -webkit-user-drag:none;
    border-radius:4px;
  }
  .obj canvas{display:block; pointer-events:none;}
  .text-content{
    outline:none; white-space:pre-wrap; word-break:break-word;
    line-height:1.25; min-height:1.2em; min-width:30px;
    cursor:move; padding:0; margin:0; font-family:inherit;
  }
  .text-content[contenteditable="true"]{cursor:text; user-select:text;}
  .obj.selected{
    outline:1.5px solid var(--accent);
    outline-offset:3px;
    border-radius:4px;
  }

  .handles{position:absolute; inset:0; pointer-events:none; display:none;}
  .obj.selected .handles{display:block;}
  .handle{
    position:absolute; width:13px; height:13px; background:#fff;
    border:2px solid var(--accent); border-radius:50%;
    pointer-events:auto;
    box-shadow: 0 2px 8px rgba(var(--accent-rgb),.5),
                0 0 0 3px rgba(255,255,255,.15);
    transition: transform .15s;
    transform: scale(calc(1 / var(--zoom)));
  }
  .handle:hover{ transform: scale(calc(1.25 / var(--zoom))); }
  .handle.nw{left:-8px; top:-8px; cursor:nwse-resize;}
  .handle.ne{right:-8px; top:-8px; cursor:nesw-resize;}
  .handle.se{right:-8px; bottom:-8px; cursor:nwse-resize;}
  .handle.sw{left:-8px; bottom:-8px; cursor:nesw-resize;}
  .rot-handle{
    position:absolute; left:50%; top:-38px; width:18px; height:18px;
    margin-left:-9px; border-radius:50%;
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    border:2px solid #fff; pointer-events:auto; cursor:grab;
    box-shadow: 0 4px 14px rgba(var(--accent-rgb),.6),
                inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .15s;
    transform: scale(calc(1 / var(--zoom)));
  }
  .rot-handle:hover{ transform: scale(calc(1.18 / var(--zoom))); }
  .rot-handle::before{
    content:''; position:absolute; left:50%; top:100%; width:2px; height:22px;
    background: linear-gradient(180deg, var(--accent), transparent);
    transform:translateX(-50%);
  }

  /* ============ SETTINGS PANEL ============ */
  #settings{
    position:absolute; left:18px; top:18px; width:252px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border:1px solid var(--line-strong);
    border-radius: var(--r-lg);
    padding:16px;
    z-index:30;
    display:flex; flex-direction:column; gap:14px;
    box-shadow: var(--shadow-3),
                inset 0 1px 0 rgba(255,255,255,.05);
    animation: panelIn .28s cubic-bezier(.2,.9,.3,1.1);
    max-height: calc(100% - 36px);
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color: rgba(255,255,255,.12) transparent;
  }
  #settings::-webkit-scrollbar{width:6px;}
  #settings::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:3px; }
  @keyframes panelIn{
    from{ opacity:0; transform: translateY(-10px) scale(.97); }
    to{ opacity:1; transform:none; }
  }
  .group{display:flex; flex-direction:column; gap:10px;}
  .group-title{
    font-size:10.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:1px; color:var(--muted2);
    display:flex; align-items:center; gap:7px;
  }
  .group-title::after{
    content:''; flex:1; height:1px;
    background: linear-gradient(90deg, var(--line-strong), transparent);
  }
  .row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12.5px; color:var(--muted); gap:8px;
  }
  .val{
    color:var(--txt); font-variant-numeric:tabular-nums; font-weight:600;
    background: var(--panel-hi);
    padding:3px 9px; border-radius:7px;
    font-size:11.5px; min-width:42px; text-align:center;
    border:1px solid var(--line);
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:5px;
    border-radius:5px;
    background: linear-gradient(90deg,
      rgba(var(--accent-rgb),.55) 0%,
      rgba(var(--accent-rgb),.55) 50%,
      rgba(255,255,255,.08) 50%,
      rgba(255,255,255,.08) 100%);
    background-size: 100% 100%;
    outline:none; margin:3px 0 5px;
    transition: background .15s;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:17px; height:17px; border-radius:50%;
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    cursor:pointer; border:2px solid #fff;
    box-shadow: 0 3px 10px rgba(var(--accent-rgb),.55),
                inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{ transform: scale(1.18); }
  input[type=range]::-webkit-slider-thumb:active{ transform: scale(.94); }
  input[type=range]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%;
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    cursor:pointer; border:2px solid #fff;
    box-shadow: 0 3px 10px rgba(var(--accent-rgb),.55);
  }

  input[type=color]{
    -webkit-appearance:none; appearance:none; border:none;
    width:46px; height:30px; background:none; cursor:pointer; padding:0;
    border-radius:9px;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  input[type=color]::-webkit-color-swatch{
    border:1.5px solid var(--line-strong); border-radius:9px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }

  select{
    width:100%; background: var(--panel-hi); color:var(--txt);
    border:1px solid var(--line); border-radius:10px;
    padding:8px 11px; font-family:inherit; font-size:12.5px;
    outline:none; cursor:pointer;
    transition: border-color .15s;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path fill='%237f8899' d='M0 0l4 5 4-5z'/></svg>");
    background-repeat:no-repeat;
    background-position: right 10px center;
    padding-right:26px;
  }
  select:hover{ border-color: var(--line-strong); }
  select option{ background:#1a1d26; color:var(--txt); }

  .palette{ display:grid; grid-template-columns: repeat(8, 1fr); gap:5px; }
  .swatch{
    aspect-ratio:1; border-radius:8px; cursor:pointer;
    border:1.5px solid rgba(255,255,255,.12);
    transition: transform .14s cubic-bezier(.3,1.3,.4,1), border-color .14s, box-shadow .14s;
    position:relative;
  }
  .swatch:hover{ transform: scale(1.14); z-index:2; }
  .swatch.active{
    border-color:#fff;
    box-shadow: 0 0 0 2px var(--accent),
                0 4px 12px rgba(var(--accent-rgb),.4);
    z-index:1;
  }

  .btn-group{display:flex; gap:6px;}
  .btn-group button{
    flex:1; height:34px; border-radius:9px; border:1px solid var(--line);
    background: var(--panel-hi); color:var(--muted);
    cursor:pointer; font-size:13px; font-family:inherit; font-weight:700;
    transition: all .15s;
  }
  .btn-group button:hover{ color:var(--txt); border-color:var(--line-strong); }
  .btn-group button.on{
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    color:#fff; border-color:transparent;
    box-shadow: 0 4px 14px rgba(var(--accent-rgb),.4),
                inset 0 1px 0 rgba(255,255,255,.25);
  }

  .action-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:6px; }
  .action-btn{
    height:36px; border-radius:9px; border:1px solid var(--line);
    background: var(--panel-hi); color:var(--muted);
    font-size:12px; font-family:inherit; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    gap:5px; transition: all .15s;
  }
  .action-btn:hover{
    color:var(--txt);
    border-color: var(--line-strong);
    background: rgba(255,255,255,.06);
  }
  .action-btn.danger:hover{
    color:#ff9a9a;
    border-color: rgba(255,107,107,.3);
    background: rgba(255,107,107,.1);
  }

  .theme-row{ display:flex; gap:6px; }
  .theme-btn{
    flex:1; height:34px; border-radius:9px; border:1px solid var(--line);
    background: var(--panel-hi); color:var(--muted);
    cursor:pointer; font-size:12px; font-weight:700; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:5px;
    transition: all .15s;
  }
  .theme-btn:hover{ color:var(--txt); border-color:var(--line-strong); }
  .theme-btn.on{
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    color:#fff; border-color:transparent;
    box-shadow: 0 4px 14px rgba(var(--accent-rgb),.35),
                inset 0 1px 0 rgba(255,255,255,.25);
  }

  /* ============ HINT ============ */
  .hint{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    font-size:12px; color:var(--muted);
    background: rgba(12,15,22,.92);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    padding:9px 18px; border-radius: 999px;
    border:1px solid var(--line-strong);
    white-space:nowrap; transition: opacity .6s;
    z-index:10; text-align:center; pointer-events:none;
    box-shadow: 0 18px 40px rgba(0,0,0,.5),
                inset 0 1px 0 rgba(255,255,255,.05);
    animation: hintIn .8s ease-out .3s backwards;
  }
  @keyframes hintIn{
    from{ opacity:0; transform:translate(-50%, 10px); }
    to{ opacity:1; transform:translate(-50%, 0); }
  }
  .hint kbd{
    background: var(--panel-hi); border:1px solid var(--line-strong);
    border-radius:5px; padding:1px 6px; font-family:inherit; font-size:11px;
    color:var(--txt); margin:0 2px; font-weight:700;
  }

  /* ============ ZOOMBAR ============ */
  .zoombar{
    position:absolute; right:18px; bottom:18px;
    display:flex; align-items:center; gap:2px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border:1px solid var(--line-strong); border-radius: 999px;
    padding:5px; z-index:20;
    box-shadow: var(--shadow-3),
                inset 0 1px 0 rgba(255,255,255,.05);
    font-size:12px; font-weight:700;
  }
  .zoombar button{
    width:32px; height:32px; border-radius:999px; border:none;
    background:transparent; color:var(--muted); cursor:pointer;
    font-size:16px; font-weight:700; font-family:inherit;
    transition: all .15s;
    display:flex; align-items:center; justify-content:center;
  }
  .zoombar button:hover{
    background: var(--panel-hi);
    color: var(--accent);
  }
  .zoombar .zval{
    min-width:56px; text-align:center; color:var(--txt);
    font-variant-numeric:tabular-nums; cursor:pointer;
    padding:0 8px;
    transition: color .15s;
  }
  .zoombar .zval:hover{ color: var(--accent); }

  /* ============ ACCENT MODAL ============ */
  .modal-backdrop{
    position:fixed; inset:0; z-index:100;
    background: rgba(4,6,11,.6);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display:none; align-items:center; justify-content:center;
    animation: fadeIn .22s ease;
  }
  .modal-backdrop.show{ display:flex; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalIn{
    from{ opacity:0; transform: translateY(16px) scale(.96); }
    to{ opacity:1; transform:none; }
  }
  .modal{
    width: 420px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 48px); overflow-y:auto;
    background:
      radial-gradient(600px 300px at 0% 0%, rgba(var(--accent-rgb),.10), transparent 60%),
      linear-gradient(180deg, #1a1e27 0%, #14171e 100%);
    border:1px solid var(--line-strong);
    border-radius: 20px;
    box-shadow: var(--shadow-3),
                inset 0 1px 0 rgba(255,255,255,.06);
    animation: modalIn .3s cubic-bezier(.2,.9,.3,1.1);
    overflow:hidden;
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--line);
  }
  .modal-header h3{
    margin:0; font-size:15px; font-weight:800; letter-spacing:.2px;
    display:flex; align-items:center; gap:9px;
    color: var(--txt);
  }
  .modal-header h3 .dot{
    width:12px; height:12px; border-radius:50%;
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.2),
                0 4px 12px rgba(var(--accent-rgb),.5);
  }
  .modal-close{
    width:32px; height:32px; border-radius:9px;
    border:1px solid var(--line); background: var(--panel-hi);
    color: var(--muted); cursor:pointer; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    transition: all .15s; line-height:1; padding:0;
    font-family:inherit;
  }
  .modal-close:hover{
    color: var(--txt);
    border-color: var(--line-strong);
    transform: rotate(90deg);
  }
  .modal-body{ padding: 18px 20px 20px; }

  .accent-preview{
    height: 74px; border-radius: 14px; overflow:hidden;
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 20px;
    margin-bottom: 18px;
    box-shadow: 0 12px 30px rgba(var(--accent-rgb),.4),
                inset 0 1px 0 rgba(255,255,255,.3);
    position:relative;
  }
  .accent-preview::after{
    content:''; position:absolute; inset:0;
    background: radial-gradient(circle at 100% 100%, rgba(255,255,255,.2), transparent 50%);
    pointer-events:none;
  }
  .accent-preview .prev-text{
    color: #fff; font-weight:800; font-size:15px;
    text-shadow: 0 2px 8px rgba(0,0,0,.2);
    letter-spacing:.3px;
  }
  .accent-preview .prev-dots{
    display:flex; gap:6px;
  }
  .accent-preview .prev-dots span{
    width:10px; height:10px; border-radius:50%;
    background: rgba(255,255,255,.7);
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }

  .accent-label{
    font-size:10.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:1px; color:var(--muted2);
    margin: 6px 0 10px;
    display:flex; align-items:center; gap:7px;
  }
  .accent-label::after{
    content:''; flex:1; height:1px;
    background: linear-gradient(90deg, var(--line-strong), transparent);
  }

  .custom-color-row{
    display:flex; align-items:center; gap:10px;
    padding:10px; border-radius:12px;
    background: var(--panel-hi);
    border:1px solid var(--line);
    margin-bottom:18px;
  }
  .custom-color-row input[type=color]{
    width:54px; height:38px; border-radius:10px;
  }
  .custom-color-row input[type=text]{
    flex:1; background:transparent; border:none; outline:none;
    color: var(--txt); font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size:13px; letter-spacing:.5px;
    padding:6px 8px;
    border-radius:8px;
  }
  .custom-color-row input[type=text]:focus{
    background: rgba(255,255,255,.04);
  }
  .custom-color-row .lbl{
    font-size:11px; color:var(--muted2); font-weight:700;
    letter-spacing:.5px; text-transform:uppercase;
  }

  .accent-preset-grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:9px;
    margin-bottom: 8px;
  }
  .accent-preset{
    aspect-ratio:1; border-radius:11px; cursor:pointer;
    border:2px solid rgba(255,255,255,.08);
    transition: transform .16s cubic-bezier(.3,1.4,.4,1), border-color .16s, box-shadow .16s;
    position:relative;
  }
  .accent-preset::after{
    content:''; position:absolute; inset:0;
    border-radius:inherit;
    background: linear-gradient(140deg, rgba(255,255,255,.2), transparent 55%);
    opacity:0; transition:opacity .16s;
    pointer-events:none;
  }
  .accent-preset:hover{
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
  }
  .accent-preset:hover::after{ opacity:1; }
  .accent-preset.active{
    border-color:#fff;
    box-shadow: 0 0 0 2px var(--accent),
                0 10px 24px rgba(0,0,0,.35);
  }
  .accent-preset.active::before{
    content:''; position:absolute; inset:-6px;
    border-radius: inherit;
    border:2px solid rgba(255,255,255,.15);
    pointer-events:none;
  }

  .modal-footer{
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display:flex; justify-content:flex-end; gap:8px;
  }
  .modal-btn{
    height:38px; padding:0 18px;
    border-radius:10px; border:1px solid var(--line);
    background: var(--panel-hi); color: var(--muted);
    font-family:inherit; font-size:13px; font-weight:700;
    cursor:pointer; transition: all .15s;
  }
  .modal-btn:hover{ color:var(--txt); border-color:var(--line-strong); }
  .modal-btn.primary{
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    border-color:transparent;
    color:#fff;
    box-shadow: 0 6px 18px rgba(var(--accent-rgb),.4),
                inset 0 1px 0 rgba(255,255,255,.25);
  }
  .modal-btn.primary:hover{
    box-shadow: 0 8px 24px rgba(var(--accent-rgb),.55),
                inset 0 1px 0 rgba(255,255,255,.35);
    transform: translateY(-1px);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 900px){
    .brand .txt{ display:none; }
    .btn .lbl{ display:none; }
    .btn{ min-width:40px; padding:0; }
    #settings{ width: 220px; }
    .hint{ font-size:11px; max-width:90vw; white-space:normal; border-radius:14px; }
    .zoombar{ right:10px; bottom:10px; }
    .accent-preset-grid{ grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">M</div>
    <span class="txt">My Board BMC</span>
  </div>

  <button class="tool" data-tool="select" data-i18n-title="tip_select">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 2.5l14.5 7.2-6.1 1.9-2.1 6.2z"/></svg>
  </button>
  <button class="tool" data-tool="brush" data-i18n-title="tip_brush">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
  </button>
  <button class="tool" data-tool="eraser" data-i18n-title="tip_eraser">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8.5L3 14.5l9-9L21 14z"/><path d="M6.5 11.5l6 6"/></svg>
  </button>
  <button class="tool" data-tool="text" data-i18n-title="tip_text">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6V4h16v2"/><path d="M12 4v16"/><path d="M8 20h8"/></svg>
  </button>

  <div class="sep"></div>

  <button class="tool" id="btn-image" data-i18n-title="tip_image">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
  </button>
  <input type="file" id="file-input" accept="image/*" multiple hidden>

  <button class="btn-accent" id="btn-accent" data-i18n-title="tip_accent">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.8 1.5-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.9.8-1.7 1.7-1.7H16c3.3 0 6-2.7 6-6 0-4.4-4.5-8.3-10-8.3z"/>
      <circle cx="6.5" cy="11.5" r="1.3" fill="currentColor" stroke="none"/>
      <circle cx="9.5" cy="7" r="1.3" fill="currentColor" stroke="none"/>
      <circle cx="14.5" cy="7" r="1.3" fill="currentColor" stroke="none"/>
      <circle cx="17.5" cy="11.5" r="1.3" fill="currentColor" stroke="none"/>
    </svg>
  </button>

  <div class="spacer"></div>

  <button class="btn ghost" id="btn-undo" data-i18n-title="tip_undo">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <button class="btn ghost" id="btn-redo" data-i18n-title="tip_redo">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
  </button>

  <div class="sep"></div>

  <select class="lang-sel" id="lang-sel" title="Language / Язык">
    <option value="ru">RU</option>
    <option value="en">EN</option>
    <option value="uk">UK</option>
  </select>

  <button class="btn ghost danger" id="btn-clear" data-i18n-title="tip_clear">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
    <span class="lbl" data-i18n="clear">Очистить</span>
  </button>
</div>

<div id="board" data-grid="dots" data-theme="light">
  <div id="world"></div>
  <svg id="preview" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="0"/>
      </filter>
    </defs>
    <path id="preview-path" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div id="settings"></div>

  <div class="zoombar">
    <button id="z-out" title="−">−</button>
    <div class="zval" id="z-val" title="Reset zoom">100%</div>
    <button id="z-in" title="+">+</button>
  </div>

  <div class="hint" id="hint"></div>
</div>

<!-- ===== ACCENT MODAL ===== -->
<div class="modal-backdrop" id="accent-modal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3><span class="dot"></span><span data-i18n="accent_title">Акцент приложения</span></h3>
      <button class="modal-close" id="accent-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="accent-preview">
        <div class="prev-text" data-i18n="accent_preview">My Board BMC</div>
        <div class="prev-dots"><span></span><span></span><span></span></div>
      </div>

      <div class="accent-label" data-i18n="accent_custom">Свой цвет</div>
      <div class="custom-color-row">
        <input type="color" id="accent-color-input" value="#6d7dff">
        <input type="text" id="accent-hex-input" value="#6d7dff" maxlength="7" spellcheck="false">
      </div>

      <div class="accent-label" data-i18n="accent_presets">Готовые пресеты</div>
      <div class="accent-preset-grid" id="accent-presets"></div>

      <div class="modal-footer">
        <button class="modal-btn" id="accent-reset" data-i18n="accent_reset">По умолчанию</button>
        <button class="modal-btn primary" id="accent-done" data-i18n="accent_done">Готово</button>
      </div>
    </div>
  </div>
</div>

<script src="board-core.js"></script>
<script src="board-app.js"></script>
</body>
</html>
